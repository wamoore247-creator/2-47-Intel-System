<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#04030c">
<title>24/7 Intel Systems — Automation · Systems · Security · AI</title>
<style>
  :root{
    --bg:#04030c; --bg2:#070a18; --card:#0e1430; --card2:#131b40;
    --border:#1e2852; --border2:#2b376b;
    --text:#f4f6ff; --muted:#9aa4c6; --dim:#68749a;
    --violet:#fded02; --cyan:#05b2ff; --grad:linear-gradient(135deg,#fded02 0%,#fc6901 100%); --blue:#044df8;
    --green:#05b2ff; --red:#f50230; --amber:#fc6901;
    --r:16px; --r2:12px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:15px; line-height:1.45;
    padding-bottom:calc(76px + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:rgba(253,237,2,.3);}
  button{font-family:inherit;}
  input,textarea,select{font-family:inherit; font-size:15px;}

  /* ---------- header ---------- */
  header{
    position:sticky; top:0; z-index:40;
    display:flex; align-items:center; gap:12px;
    padding:14px 16px; padding-top:calc(14px + env(safe-area-inset-top));
    background:rgba(4,3,12,.85); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--border);
  }
  .logo{width:40px;height:40px;flex:0 0 auto;border-radius:11px;box-shadow:0 4px 16px rgba(252,105,1,.4);}
  .brand-txt{flex:1;min-width:0;}
  .brand-txt h1{margin:0;font-size:16px;font-weight:800;letter-spacing:.3px;}
  .brand-txt .sub{margin:0;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bell{position:relative;width:42px;height:42px;flex:0 0 auto;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .bell svg{width:20px;height:20px;}
  .badge{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg);}

  /* ---------- layout ---------- */
  main{max-width:640px;margin:0 auto;padding:16px 14px 24px;}
  .view-title{font-size:20px;font-weight:800;margin:6px 0 14px;display:flex;align-items:center;gap:8px;}
  .view-title .hint{font-size:12.5px;color:var(--muted);font-weight:500;}

  /* ---------- cards ---------- */
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:14px;}
  .card h3{margin:0 0 4px;font-size:15px;font-weight:700;}
  .card .lead{margin:0 0 12px;color:var(--muted);font-size:13px;}

  /* ---------- hero ---------- */
  .hero{background:var(--grad);border-radius:20px;padding:20px;margin-bottom:14px;position:relative;overflow:hidden;color:#04030c;}
  .hero::after{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;background:rgba(255,255,255,.14);border-radius:50%;}
  .hero::before{content:"";position:absolute;right:40px;bottom:-70px;width:150px;height:150px;background:rgba(255,255,255,.10);border-radius:50%;}
  .hero .hello{font-size:13px;opacity:.9;margin:0 0 2px;}
  .hero .big{margin:0;font-size:26px;font-weight:800;letter-spacing:-.3px;}
  .hero .mrr{margin:8px 0 14px;font-size:13.5px;opacity:.95;}
  .hero .mrr b{font-size:17px;}

  /* ---------- KPI grid ---------- */
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
  .kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);padding:13px 14px;}
  .kpi .ic{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;margin-bottom:8px;background:rgba(253,237,2,.16);}
  .kpi.g .ic{background:rgba(5,178,255,.15);}
  .kpi.a .ic{background:rgba(252,105,1,.18);}
  .kpi.r .ic{background:rgba(245,2,48,.15);}
  .kpi .v{font-size:21px;font-weight:800;letter-spacing:-.3px;}
  .kpi .l{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:2px;}

  /* ---------- buttons ---------- */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:12px;padding:11px 16px;font-size:14px;font-weight:700;cursor:pointer;transition:transform .06s ease,opacity .15s;}
  .btn:active{transform:scale(.97);}
  .btn.primary{background:var(--grad);color:#04030c;box-shadow:0 6px 18px rgba(252,105,1,.4);}
  .btn.ghost{background:var(--card2);color:var(--text);border:1px solid var(--border2);}
  .btn.danger{background:rgba(255,92,108,.14);color:var(--red);border:1px solid rgba(255,92,108,.3);}
  .btn.block{width:100%;}
  .btn.sm{padding:8px 12px;font-size:13px;border-radius:10px;}
  .row{display:flex;gap:10px;}
  .row .btn{flex:1;}

  /* ---------- quick actions ---------- */
  .qa{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px;}
  .qa .q{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);padding:13px 6px;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;text-align:center;}
  .qa .q .e{font-size:20px;}
  .qa .q span{font-size:11px;color:var(--muted);font-weight:600;}

  /* ---------- lists ---------- */
  .item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);}
  .item:last-child{border-bottom:none;}
  .avatar{width:42px;height:42px;border-radius:12px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#fff;}
  .item .mid{flex:1;min-width:0;}
  .item .t{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .item .s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .chip{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;letter-spacing:.3px;}
  .chip.lead{background:rgba(252,105,1,.18);color:var(--amber);}
  .chip.client{background:rgba(5,178,255,.15);color:var(--green);}
  .chip.basic{background:rgba(0,210,255,.15);color:var(--cyan);}
  .chip.pro{background:rgba(253,237,2,.18);color:var(--violet);}
  .chip.full{background:rgba(255,176,32,.16);color:var(--amber);}
  .chip.err{background:rgba(255,92,108,.15);color:var(--red);}
  .chip.ok{background:rgba(5,178,255,.15);color:var(--green);}
  .chip.paused{background:rgba(139,147,167,.18);color:var(--muted);}

  /* ---------- search / filter ---------- */
  .search{width:100%;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:11px 14px;color:var(--text);outline:none;}
  .search::placeholder{color:var(--dim);}
  .chips{display:flex;gap:8px;margin:12px 0;}
  .chipbtn{background:var(--card);border:1px solid var(--border);color:var(--muted);border-radius:20px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer;}
  .chipbtn.on{background:var(--grad);color:#04030c;border-color:transparent;}

  /* ---------- packs grid ---------- */
  .packs{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .pack{background:var(--card);border:1px solid var(--border);border-radius:var(--r2);padding:14px;cursor:pointer;transition:border-color .15s;}
  .pack:active{border-color:var(--violet);}
  .pack .e{font-size:22px;}
  .pack .t{font-weight:800;font-size:13.5px;margin:8px 0 3px;line-height:1.25;}
  .pack .d{font-size:11.5px;color:var(--muted);line-height:1.35;margin-bottom:9px;}
  .pack .meta{display:flex;align-items:center;justify-content:space-between;}

  /* ---------- tabs ---------- */
  .tabbar{
    position:fixed;left:0;right:0;bottom:0;z-index:50;
    display:flex;justify-content:space-around;
    background:rgba(4,3,12,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border-top:1px solid var(--border);
    padding:8px 4px calc(8px + env(safe-area-inset-bottom));
  }
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;color:var(--dim);cursor:pointer;font-size:10.5px;font-weight:700;}
  .tab svg{width:23px;height:23px;}
  .tab.on{color:var(--cyan);}
  .tab.on svg{filter:drop-shadow(0 2px 8px rgba(0,210,255,.45));}

  /* ---------- modal ---------- */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s;}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .sheet{background:var(--bg2);border:1px solid var(--border2);border-bottom:none;border-radius:22px 22px 0 0;width:100%;max-width:640px;max-height:88vh;display:flex;flex-direction:column;animation:up .22s cubic-bezier(.2,.9,.3,1);}
  @keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
  .sheet .head{display:flex;align-items:center;gap:10px;padding:16px 18px 10px;}
  .sheet .head .t{font-size:17px;font-weight:800;flex:1;}
  .sheet .x{width:34px;height:34px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;}
  .sheet .body{padding:4px 18px calc(20px + env(safe-area-inset-bottom));overflow-y:auto;}
  .grip{width:42px;height:4px;border-radius:2px;background:var(--border2);margin:8px auto 0;}

  /* ---------- forms ---------- */
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;}
  .field input,.field select,.field textarea{width:100%;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;color:var(--text);outline:none;}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--cyan);}
  .field textarea{resize:vertical;min-height:84px;line-height:1.5;}

  /* ---------- misc ---------- */
  .divider{height:1px;background:var(--border);margin:14px 0;}
  .kv{display:flex;justify-content:space-between;padding:6px 0;font-size:13.5px;}
  .kv .k{color:var(--muted);}
  .kv .val{font-weight:700;text-align:right;}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:12px;color:#c9d4e8;white-space:pre-wrap;word-break:break-word;line-height:1.55;max-height:240px;overflow:auto;}
  .toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#fded02;color:#04030c;padding:11px 18px;border-radius:20px;font-weight:700;font-size:13.5px;z-index:90;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;box-shadow:0 8px 30px rgba(0,0,0,.4);max-width:86vw;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
  .empty{text-align:center;color:var(--dim);padding:30px 10px;font-size:13.5px;}
  .steps{counter-reset:s;list-style:none;padding:0;margin:0;}
  .steps li{position:relative;padding:0 0 14px 38px;counter-increment:s;}
  .steps li::before{content:counter(s);position:absolute;left:0;top:0;width:26px;height:26px;border-radius:9px;background:rgba(253,237,2,.16);color:var(--violet);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;}
  .steps li::after{content:"";position:absolute;left:12px;top:30px;bottom:2px;width:2px;background:var(--border);}
  .steps li:last-child::after{display:none;}
  .steps li .st{font-weight:700;font-size:13.5px;}
  .steps li .sd{font-size:12.5px;color:var(--muted);margin-top:1px;}
  .seg{display:flex;background:var(--bg);border:1px solid var(--border);border-radius:11px;padding:3px;gap:3px;margin-bottom:14px;}
  .seg button{flex:1;border:none;background:none;color:var(--muted);padding:8px;border-radius:8px;font-size:12.5px;font-weight:700;cursor:pointer;}
  .seg button.on{background:var(--card2);color:var(--text);border:1px solid var(--border2);}
  .swatches{display:flex;gap:8px;}
  .sw{width:26px;height:26px;border-radius:8px;border:1px solid rgba(255,255,255,.1);}
  .notif{display:flex;gap:11px;padding:12px 0;border-bottom:1px solid var(--border);align-items:flex-start;}
  .notif:last-child{border-bottom:none;}
  .notif .dot{width:34px;height:34px;border-radius:10px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:15px;}
  .notif .tx{flex:1;}
  .notif .tt{font-size:13.5px;font-weight:600;}
  .notif .tm{font-size:11.5px;color:var(--dim);margin-top:2px;}
  .check{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--border2);background:var(--bg);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:transparent;font-size:13px;}
  .check.on{background:var(--grad);border-color:transparent;color:#04030c;}
</style>
</head>

const esc = (s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const nowTime = ()=>{const d=new Date();return d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});};
const avatarColor = (name)=>{
  const cols=['#05b2ff','#044df8','#fc6901','#f50230','#8fabb4','#59333c','#0c2c6b','#00b8d9'];
  let h=0; for(const ch of String(name)) h=(h*31+ch.charCodeAt(0))>>>0;
  return cols[h%cols.length];
};

let toastT;
function toast(msg){
  const t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200);
}

function copyText(id){
  const ta=$(id); if(!ta){toast('Nothing to copy');return;}
  let ok=false;
  try{
    ta.focus(); ta.select(); ta.setSelectionRange(0,999999);
    ok=document.execCommand('copy');
  }catch(e){ ok=false; }
  if(!ok){
    try{ navigator.clipboard.writeText(ta.value); ok=true; }catch(e){ ok=false; }
  }
  toast(ok?'Copied to clipboard':'Select the text and copy manually');
}

let S=null;
const LS_KEY='maa_mobile_os_v1';

function load(){
  try{
    const raw=localStorage.getItem(LS_KEY);
    if(raw){ const p=JSON.parse(raw); if(p&&p.settings){
      if(p.settings.name==='MAA Mobile OS'){
        p.settings.name='24/7 Intel Systems';
        p.settings.tag='Automation · Systems · Security · AI';
        p.settings.welcome=(p.settings.welcome||'').replace('MAA','24/7 Intel Systems');
      }
      if(!p.settings.paymentLinks) p.settings.paymentLinks={stripe:'https://buy.stripe.com/5kQbJ33Wh3Czcvi0DUfjG00',cashapp:'',paypal:''};
      else if(!p.settings.paymentLinks.stripe) p.settings.paymentLinks.stripe='https://buy.stripe.com/5kQbJ33Wh3Czcvi0DUfjG00';
      S=p; save(); return;
    } }
  }catch(e){}
  S=defaultState(); save();
}
function save(){
  try{ localStorage.setItem(LS_KEY,JSON.stringify(S)); }catch(e){}
}

/* ---------------- derived data ---------------- */
function clientById(id){return S.clients.find(c=>c.id===id);}
function packById(id){return PACKS.find(p=>p.id===id);}
function planName(plan){const t=TIERS.find(x=>x.id===plan);return t?t.name:'—';}
function mrr(){return S.subscriptions.filter(s=>s.status==='active').reduce((a,s)=>a+s.price,0);}
function monthRevenue(){
  const m=today().slice(0,7);
  let sum=0;
  for(const c of S.clients) for(const p of c.payments) if((p.date||'').slice(0,7)===m) sum+=p.amount;
  return sum;
}
function openTasks(){return S.tasks.filter(t=>!t.done).length;}
function unread(){return S.notifications.filter(n=>!n.read).length;}
function activeAutos(){return S.automations.filter(a=>a.status==='active').length;}
function errorAutos(){return S.automations.filter(a=>a.status==='error').length;}

function pushNotif(kind,icon,text){
  S.notifications.unshift({id:uid('n'),kind,icon,text,time:'just now',read:false});
  if(S.notifications.length>50) S.notifications.length=50;
  save();
}
function pushActivity(text){
  S.revenue=[]; // placeholder kept for future; activity derived from notifications
}

/* ---------------- AI summary engine ---------------- */
function generateSummary(){
  const todayStr=today();
  const todays=S.events.filter(e=>e.day===todayStr);
  const wk=todayStr.slice(0,7);
  let pay=0; for(const c of S.clients) for(const p of c.payments) if((p.date||'').slice(0,7)===wk) pay+=p.amount;
  const leadsWk=S.clients.filter(c=>c.status==='lead').length;
  const open=S.tasks.filter(t=>!t.done).length;
  const lines=[];
  lines.push('MORNING SUMMARY \u2014 '+new Date().toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'}));
  lines.push('');
  lines.push('📅 Calendar: '+(todays.length?todays.map(e=>e.time+' '+e.title).join(' · '):'no appointments today'));
  lines.push('💬 Messages: '+unread()+' unread alerts in your 24/7 inbox');
  lines.push('✅ Tasks: '+open+' open \u2014 '+S.tasks.filter(t=>!t.done).map(t=>t.text).join('; '));
  lines.push('📝 Notes: '+(S.clients.reduce((a,c)=>a+c.notes.length,0))+' total client notes on file');
  lines.push('💰 Sales this month: '+money(pay)+' collected');
  lines.push('👥 Pipeline: '+leadsWk+' open lead(s) to follow up on');
  lines.push('⚙️ Automations: '+activeAutos()+' running, '+errorAutos()+' with errors');
  const text=lines.join('\n');
  S.summary={text,date:todayStr};
  pushNotif('ok','✅','Daily summary generated and sent.');
  save(); render(); toast('Summary generated');
}

function buildRecipe(packId,opts){
  const p=packById(packId);
  const client=opts.clientName||'[Client name]';
  const t=TIERS.find(x=>x.id===p.tier);
  const L=[];
  L.push('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
  L.push('  24/7 INTEL SYSTEMS · '+p.name.toUpperCase());
  L.push('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
  L.push('Client      : '+client);
  L.push('Pack        : '+p.name+' ('+t.name+' tier)');
  L.push('Trigger     : '+(opts.trigger||p.trigger));
  L.push('Delivery    : '+(opts.delivery||'SMS / email'));
  L.push('');
  L.push('STEPS');
  p.actions.forEach((a,i)=>L.push('  '+(i+1)+'. '+a));
  L.push('');
  L.push('CONFIG');
  L.push('  enabled     : true');
  L.push('  schedule    : '+(opts.schedule||'daily'));
  L.push('  notify_on   : '+(opts.notifyOn||'success + error'));
  L.push('  retry       : 3 attempts, 10 min apart');
  L.push('');
  L.push('NOTE');
  L.push('  Install on '+(opts.platform||'iOS Shortcuts / Zapier / Tasker'));
  L.push('  Then message your client: "Your pack is ready!"');
  L.push('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
  return L.join('\n');
}

/*==PDF_EXPORT_START==*/
function sanitizePDF(s){
  s=String(s==null?'':s);
  const map={'—':'-','–':'-','’':"'",'‘':"'",'“':'"','”':'"','•':'-','…':'...','✓':'[x]','✔':'[x]','★':'*','→':'->','·':'-','\u00A0':' ','é':'e','è':'e','ê':'e','ë':'e','á':'a','à':'a','â':'a','ã':'a','ä':'a','å':'a','í':'i','ì':'i','î':'i','ï':'i','ó':'o','ò':'o','ô':'o','õ':'o','ö':'o','ú':'u','ù':'u','û':'u','ü':'u','ñ':'n','ç':'c','ý':'y','ÿ':'y','ø':'o','œ':'oe','æ':'ae','ß':'ss'};
  return s.replace(/[^\x20-\x7E]/g,function(ch){return map[ch]!==undefined?map[ch]:'';}).replace(/([\\()])/g,'\\$1');
}
function _blen(s){ if(typeof TextEncoder!=='undefined'){return new TextEncoder().encode(s).length;} return s.length; }
function _pad10(n){ var s=String(n); while(s.length<10)s='0'+s; return s; }
function wrap(s,maxc){
  var out=[]; var parts=String(s).split('\n');
  for(var i=0;i<parts.length;i++){
    var p=parts[i];
    if(p.length<=maxc){out.push(p);continue;}
    var words=p.split(' '), cur2='';
    for(var j=0;j<words.length;j++){
      var w=words[j];
      if(cur2.length+w.length+1>maxc){out.push(cur2);cur2=w;}else{cur2=cur2?cur2+' '+w:w;}
    }
    if(cur2)out.push(cur2);

}
function buildReportPDF(d){
  var PAGES=[], cur=[], y=748;
  var W=612, ML=48, CW=W-ML*2;
  function page(){ cur=[]; PAGES.push(cur); y=748; }
  function raw(o){ cur.push(o); }
  function room(h){ if(y-h<54) page(); }
  function line(str,x,size,font,color,lh){
    if(x==null)x=ML; if(size==null)size=10; if(font==null)font='F1'; if(color==null)color='0 0 0';
    if(lh==null)lh=Math.round(size*1.42*10)/10;
    room(lh);
    raw(color+' rg BT /'+font+' '+size+' Tf '+x+' '+y+' Td ('+sanitizePDF(str)+') Tj ET');
    y-=lh;
  }
  function h1(t){ line(String(t).toUpperCase(),ML,17,'F2','0.42 0.36 0.91',22); }
  function h2(t){ line(t,ML,12,'F2','0.05 0.55 0.75',18); }
  function rule(){ raw('0.85 0.87 0.93 rg '+ML+' '+(y-2)+' '+CW+' 1 re f'); y-=10; }
  function trunc(s,maxc){ s=sanitizePDF(s); if(s.length<=maxc)return s; return s.slice(0,maxc-1)+'~'; }
  function cell(s,x,w,size,font,color){ var mc=Math.max(6,Math.floor(w/(size*0.53))); line(trunc(s,mc),x,size,font,color); }
  function statusColor(s){
    s=String(s).toLowerCase();
    if(s==='active'||s==='client'||s==='ok')return '0.15 0.62 0.4';
    if(s==='error')return '0.86 0.22 0.34';
    if(s==='paused'||s==='lead')return '0.83 0.54 0.1';
    return '0 0 0';
  }
  function kpiRow(aL,aV,bL,bV){
    var base=y;
    line(aL+':',ML,9,'F1','0.45 0.48 0.55',12);
    line(String(aV),ML,13,'F2','0 0 0',16);
    line(bL+':',ML+280,9,'F1','0.45 0.48 0.55',12);
    line(String(bV),ML+280,13,'F2','0 0 0',16);
    y=base-30;
  }
  function table(headers,rows,widths){
    var x,i,r,c;
    function drawHead(){
      x=ML;
      for(i=0;i<headers.length;i++){ cell(headers[i],x,widths[i],9,'F2','0.35 0.38 0.5'); x+=widths[i]; }
      y-=3; rule();
    }
    drawHead();
    for(r=0;r<rows.length;r++){
      if(y<58){ page(); drawHead(); }
      x=ML; var row=rows[r];
      for(c=0;c<row.length;c++){
        var col=row[c];
        cell(col.t,x,widths[c],9,col.bold?'F2':'F1',col.color||'0 0 0');
        x+=widths[c];
      }
      y-=2;
    }
  }
  page();
  h1(d.name);
  line(d.tag+'   ·   '+d.date+'   ·   '+d.owner,ML,10,'F3','0.45 0.48 0.55',15);
  y-=8; rule();
  h2('Key metrics');
  kpiRow('Monthly recurring revenue', d.mrr, 'Collected this month', d.month);
  kpiRow('Active clients', d.activeClients, 'Active automations', d.activeAutos);
  kpiRow('Open leads', d.leads, 'Open tasks', d.openTasks);
  y-=6;
  h2('Clients ('+d.clients.length+')');
  table(['Name','Business','Type','Plan','Status','Joined'],
    d.clients.map(function(c){return [{t:c.name},{t:c.biz},{t:c.type},{t:c.plan},{t:c.status,color:statusColor(c.status)},{t:c.joined}];}),
    [118,132,82,70,54,60]);
  y-=6;
  h2('Subscriptions ('+d.subs.length+')');
  table(['Client','Plan','Price','Status','Next','Method'],
    d.subs.map(function(s){return [{t:s.client},{t:s.plan},{t:s.price},{t:s.status,color:statusColor(s.status)},{t:s.next},{t:s.method}];}),
    [140,90,60,55,70,101]);
  y-=6;
  h2('Automations ('+d.autos.length+')');
  table(['Client','Pack','Status','Last run'],
    d.autos.map(function(a){return [{t:a.client},{t:a.pack},{t:a.status,color:statusColor(a.status)},{t:a.last}];}),
    [150,200,60,106]);
  y-=6;
  if(d.pay.length){
    h2('Payments ('+d.pay.length+')');
    table(['Client','Amount','Date','Method'],
      d.pay.map(function(p){return [{t:p.client},{t:'$'+p.amount},{t:p.date},{t:p.method}];}),
      [186,100,100,130]);
    y-=6;
  }
  if(d.summary){
    h2('Daily summary');
    var lines=wrap(d.summary,95);
    for(var li=0;li<lines.length;li++){ line(lines[li],ML,9,'F3','0.2 0.22 0.3',12); }
  }
  var total=PAGES.length;
  for(var p=0;p<PAGES.length;p++){
    cur=PAGES[p];
    raw('0.72 0.75 0.84 rg BT /F1 8 Tf '+ML+' 32 Td ('+sanitizePDF(d.name+' — generated '+d.date)+') Tj ET');
    raw('0.72 0.75 0.84 rg BT /F1 8 Tf '+(W-ML-70)+' 32 Td (Page '+(p+1)+' / '+total+') Tj ET');
  }
  var nP=PAGES.length;
  var objs=[];
  objs.push('<< /Type /Catalog /Pages 2 0 R >>');
  var kids=[]; for(var k=0;k<nP;k++){ kids.push((6+k)+' 0 R'); }
  objs.push('<< /Type /Pages /Count '+nP+' /Kids ['+kids.join(' ')+'] >>');
  objs.push('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>');
  objs.push('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >>');
  objs.push('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Oblique >>');
  for(var pi=0;pi<nP;pi++){
    var csId=6+nP+pi;
    objs.push('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << /Font << /F1 3 0 R /F2 4 0 R /F3 5 0 R >> >> /Contents '+csId+' 0 R >>');
  }
  for(var si=0;si<nP;si++){
    var content=PAGES[si].join('\n');
    objs.push('<< /Length '+_blen(content)+' >>\nstream\n'+content+'\nendstream');
  }
  var out='%PDF-1.4\n';
  var offs=new Array(objs.length+1); for(var oi=0;oi<offs.length;oi++)offs[oi]=0;
  for(var bi=0;bi<objs.length;bi++){ offs[bi+1]=_blen(out); out+=(bi+1)+' 0 obj\n'+objs[bi]+'\nendobj\n'; }
  var xref=_blen(out);
  out+='xref\n0 '+(objs.length+1)+'\n0000000000 65535 f \n';
  for(var xi=0;xi<objs.length;xi++){ out+=_pad10(offs[xi+1])+' 00000 n \n'; }
  out+='trailer\n<< /Size '+(objs.length+1)+' /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF';
  return out;
}
